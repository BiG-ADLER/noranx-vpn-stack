# Example Nginx configuration for Marzban with Device Limiter

server {
    listen 8443 ssl http2;
    server_name marz-api.example.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Route subscription requests through Device Limiter
    location /sub/ {
        proxy_pass http://127.0.0.1:3000;  # Device Limiter port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;  # Critical!
        proxy_http_version 1.1;
    }

    # All other requests go directly to Marzban
    location / {
        proxy_pass http://127.0.0.1:8000;  # Marzban port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
