# panel.bigadler.xyz — Marzban admin panel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.bigadler.xyz;

    ssl_certificate     /etc/letsencrypt/live/sub.ibaxgames.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.ibaxgames.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass https://127.0.0.1:18000;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 8000 ssl http2;
    listen [::]:8000 ssl http2;
    server_name panel.bigadler.xyz;

    ssl_certificate     /etc/letsencrypt/live/sub.ibaxgames.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.ibaxgames.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass https://127.0.0.1:18000;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.bigadler.xyz;
    return 301 https://$host$request_uri;
}
