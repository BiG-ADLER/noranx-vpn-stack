server {
    listen 80;
    listen [::]:80;
    server_name bot.bigadler.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.bigadler.xyz;

    ssl_certificate     /etc/letsencrypt/live/sub.ibaxgames.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.ibaxgames.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8080/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    location / {
        return 200 'NoranX VPN Bot';
        add_header Content-Type text/plain;
    }
}
