# de.bigadler.xyz — legacy redirects + :8000/:443 fallbacks
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name de.bigadler.xyz;

    ssl_certificate     /etc/letsencrypt/live/de.bigadler.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/de.bigadler.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /sub/ {
        return 301 https://sub.ibaxgames.ir$request_uri;
    }

    location / {
        return 301 https://panel.bigadler.xyz$request_uri;
    }
}

server {
    listen 8000 ssl http2;
    listen [::]:8000 ssl http2;
    server_name de.bigadler.xyz;

    ssl_certificate     /etc/letsencrypt/live/de.bigadler.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/de.bigadler.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /sub/ {
        return 301 https://sub.ibaxgames.ir$request_uri;
    }

    location / {
        return 301 https://panel.bigadler.xyz$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name de.bigadler.xyz;
    return 301 https://panel.bigadler.xyz$request_uri;
}
